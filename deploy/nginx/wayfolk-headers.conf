# The site's security headers (README.md, Running it live, TLS and the proxy). Copy to
# /etc/nginx/snippets/wayfolk-headers.conf; wayfolk.conf includes it in the
# server block, and again in each location that adds a header of its own
# (nginx drops the server block's there). (example.com is in connect-src.)
#
# The CSP starts Report-Only: play through everything with the browser's
# console open (Google sign-in, Premium's checkout, sounds, the legal pages),
# add what it says was blocked, then rename it Content-Security-Policy.
# 'unsafe-eval': Pixi 7 builds its shaders with new Function. Put the Sentry
# ingest host from the client's DSN in connect-src if it's another.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://example.com https://accounts.google.com/gsi/ https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; object-src 'none'" always;
