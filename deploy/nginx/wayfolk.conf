# Wayfolk's site for nginx (README.md, Running it live, TLS and the proxy), at example.com.
# Copy to /etc/nginx/sites-available/wayfolk, link it into sites-enabled, then
# `nginx -t && systemctl reload nginx`. The certificate is from certbot
# (`certbot certonly --nginx -d example.com -d www.example.com`).
# www.example.com is sent on to example.com, so the game has one address.
#
# The client is built for this with:
#   npm run build -- --env SERVER_IP=example.com --env SERVER_PORT=443 --env SERVER_PATH=/ws

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # the client: only client/dist is served
    root /srv/wayfolk/client/dist;
    index index.html;

    # compress text (stock nginx gzips only HTML): bundle.js is 1.7 MB, about a quarter of that gzipped
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    # Security headers (always: error pages too), in the snippet
    # (wayfolk-headers.conf) so the locations below that add a header of their
    # own can include them again
    include /etc/nginx/snippets/wayfolk-headers.conf;

    # Kept by the browser but checked each load (their names don't change
    # between builds: cached blind, a refresh could load the old client).
    # (add_header inside a location drops the server's: `include` repeats them)
    location = /index.html { include /etc/nginx/snippets/wayfolk-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /bundle.js  { include /etc/nginx/snippets/wayfolk-headers.conf; add_header Cache-Control "no-cache" always; }
    location /assets/      { include /etc/nginx/snippets/wayfolk-headers.conf; add_header Cache-Control "no-cache" always; }
    location /css/         { include /etc/nginx/snippets/wayfolk-headers.conf; add_header Cache-Control "no-cache" always; }

    # the game server (port 5301, firewalled off from outside): the WebSocket...
    location /ws {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;        # (the server pings every 30s)
    }

    # ...Stripe's webhook, and the uptime check's
    location /stripe/webhook {
        proxy_pass http://127.0.0.1:5301;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5301;
    }

    # ...and the Analytics on a phone (its page, and its data behind STATS_KEY)
    location /stats {
        proxy_pass http://127.0.0.1:5301;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nothing hidden (.htaccess and the like)
    location ~ /\. { deny all; }
}
